name: Wypchnij obraz na Docker Hub

# Uruchamiany RECZNIE (workflow_dispatch), nigdy automatycznie przy pushu -
# push na Docker Hub to swiadomy krok, nie efekt uboczny commita.
# Zaklada, ze docker-build-test.yml juz potwierdzil, ze obraz sie buduje.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag obrazu"
        required: true
        default: "v1"
      update_latest:
        description: "Nadpisac tez tag 'latest' tym obrazem?"
        type: boolean
        required: true
        default: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # timeout-minutes + brak cache-from/cache-to: type=gha - patrz
    # docker-build-test.yml (identyczna diagnostyka, sierpien 2026):
    # 3 buildy z rzedu wisialy ~25-30 min z "duration_ms: 0" i bez logow,
    # naprawilo to dopiero wylaczenie cache GHA + timeout.
    timeout-minutes: 25
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Zwolnij miejsce na dysku runnera
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Ustaw Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Zaloguj do Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # update_latest=false (sierpien 2026, dodane przy rownoleglym testowaniu
      # dwoch wersji InvokeAI): "latest" ma zawsze wskazywac na NAJNOWSZA
      # przetestowana wersje, nie na "ostatnia rzecz ktora ktos wypchnal".
      # Bez tego przelacznika kazdy push (np. starszej wersji do testow
      # porownawczych) bezwarunkowo nadpisywalby "latest" - co jest dobre
      # przy normalnym, liniowym wydawaniu kolejnych wersji, ale niebezpieczne
      # przy celowym wypychaniu dwoch wersji obok siebie do porownania.
      - name: Ustal liste tagow do wypchniecia
        id: tags
        run: |
          TAGS="${{ secrets.DOCKERHUB_USERNAME }}/foto-ai-serwer:${{ github.event.inputs.tag }}"
          if [ "${{ github.event.inputs.update_latest }}" = "true" ]; then
            TAGS="${TAGS}
          ${{ secrets.DOCKERHUB_USERNAME }}/foto-ai-serwer:latest"
          fi
          {
            echo "list<<TAGS_EOF"
            echo "$TAGS"
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      # secrets: CIVITAI_API_KEY - patrz komentarz w docker-build-test.yml
      # (ten sam mechanizm --mount=type=secret w Dockerfile).
      - name: Zbuduj i wypchnij obraz
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.list }}
          secrets: |
            CIVITAI_API_KEY=${{ secrets.CIVITAI_API_KEY }}
