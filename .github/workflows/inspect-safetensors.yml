name: Diagnostyka - klucze tensorow w safetensors (jednorazowe, do usuniecia po uzyciu)

# Tymczasowy workflow diagnostyczny - NIE czesc normalnego pipeline'u.
# Cel: sprawdzic nazwy kluczy tensorow (i config.json, jesli istnieje) w
# plikach .safetensors z HuggingFace BEZ pobierania calego pliku (tylko
# naglowek, przez HTTP Range) i BEZ buildowania obrazu Docker - potrzebne
# bo ta sesja Claude ma zablokowany bezposredni dostep do huggingface.co
# (polityka egress), a runner GitHub Actions ma pelny dostep do sieci.

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Pelny URL do pliku .safetensors (resolve/main/...)"
        required: true
      config_url:
        description: "Opcjonalny URL do config.json w tym samym repo"
        required: false
        default: ""

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Pobierz config.json (jesli podany)
        if: ${{ github.event.inputs.config_url != '' }}
        run: |
          echo "=== config.json ==="
          curl -sSL "${{ github.event.inputs.config_url }}" || echo "(brak lub blad pobierania)"
          echo ""

      - name: Sprawdz naglowek safetensors (bez pobierania calego pliku)
        run: |
          python3 << 'PYEOF'
          import urllib.request
          import struct
          import json
          import os

          url = os.environ["TARGET_URL"]

          def fetch_range(start, end):
              req = urllib.request.Request(url, headers={
                  "Range": f"bytes={start}-{end}",
                  "User-Agent": "Mozilla/5.0",
              })
              with urllib.request.urlopen(req, timeout=60) as resp:
                  return resp.read()

          # safetensors format: pierwsze 8 bajtow = dlugosc naglowka JSON (little-endian uint64)
          head = fetch_range(0, 7)
          n = struct.unpack("<Q", head)[0]
          print(f"Dlugosc naglowka JSON: {n} bajtow")

          header_bytes = fetch_range(8, 8 + n - 1)
          header = json.loads(header_bytes)

          keys = [k for k in header.keys() if k != "__metadata__"]
          print(f"Liczba tensorow: {len(keys)}")
          print()
          print("=== Metadata (jesli jest) ===")
          print(json.dumps(header.get("__metadata__", {}), indent=2))
          print()
          print("=== Pierwsze 40 kluczy tensorow (posortowane) ===")
          for k in sorted(keys)[:40]:
              print(f"  {k}  dtype={header[k].get('dtype')}  shape={header[k].get('shape')}")
          print()
          print("=== Szukam kluczowych wzorcow ===")
          patterns = [
              "double_blocks.0.img_attn.proj.weight.quant_state.bitsandbytes__nf4",
              "model.diffusion_model.double_blocks.0.img_attn.proj.weight.quant_state.bitsandbytes__nf4",
              "double_blocks.0.img_attn.proj.weight",
              "model.diffusion_model.double_blocks.0.img_attn.proj.weight",
              "transformer_blocks.0.attn.to_q.weight",
              "single_transformer_blocks.0.attn.to_q.weight",
              "x_embedder.weight",
              "context_embedder.weight",
          ]
          for p in patterns:
              print(f"  {'ZNALEZIONO' if p in header else 'brak       '}: {p}")

          print()
          print("=== Wszystkie unikalne prefiksy top-level (przed pierwsza kropka po numerze/nazwie) ===")
          prefixes = set()
          for k in keys:
              parts = k.split(".")
              prefixes.add(parts[0])
          for p in sorted(prefixes):
              print(f"  {p}")
          PYEOF
        env:
          TARGET_URL: ${{ github.event.inputs.url }}
