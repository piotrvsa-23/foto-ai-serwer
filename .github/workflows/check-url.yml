name: Diagnostyka - sprawdz URL/rozmiar pliku (jednorazowe)

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Lista URL (jeden na linie) do sprawdzenia HEAD-em"
        required: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: HEAD request dla kazdego URL
        run: |
          while IFS= read -r url; do
            [ -z "$url" ] && continue
            echo "=== $url ==="
            curl -sSL -I -H "User-Agent: Mozilla/5.0" "$url" | grep -iE "^(HTTP|content-length|location)" || echo "(blad)"
            echo ""
          done <<< "${{ github.event.inputs.urls }}"
