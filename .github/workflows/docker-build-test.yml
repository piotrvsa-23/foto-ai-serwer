name: Test builda obrazu Docker

# Ten workflow TYLKO buduje obraz (walidacja, ze Dockerfile dziala,
# ze wersje/zaleznosci sie zgadzaja) - NIE wypycha nic na Docker Hub
# i NIE dotyka RunPod. Push na Docker Hub to osobny, swiadomy krok
# wykonywany dopiero po potwierdzeniu, ze build przechodzi tutaj.

on:
  push:
    branches:
      - '**'
    paths:
      - 'Dockerfile'
      - 'scripts/**'
      - 'config/**'
      - '.github/workflows/docker-build-test.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    # timeout-minutes (sierpien 2026, po TRZECH buildach z rzedu, ktore
    # wisialy ~25-30 min i konczyly sie "duration_ms: 0" + brak logow -
    # objaw "zombie" runnera, nie normalny blad skryptu, przetrwal nawet
    # dodanie --connect-timeout/--max-time do wszystkich curl w Dockerfile,
    # wiec przyczyna NIE jest w samym curlu). Bez tego limitu taki zawieszony
    # build wisi bez konca i marnuje czas/CI minuty bez zadnego czytelnego
    # bledu - GitHub Actions sam przerwie go po 20 min z jasnym "cancelled".
    timeout-minutes: 20
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      # Standardowy runner GitHub ma ograniczony wolny dysk -
      # ten obraz (CUDA devel + PyTorch + ComfyUI + SwarmUI + InvokeAI)
      # moze byc duzy, wiec agresywnie zwalniamy miejsce. .NET dla SwarmUI
      # instalujemy WEWNATRZ obrazu (w Dockerfile) - preinstalowany .NET
      # na samym runnerze jest wiec zbedny i mozna go bezpiecznie skasowac.
      - name: Zwolnij miejsce na dysku runnera
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Ustaw Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Bez load:true - obraz robi sie zbyt duzy zeby dodatkowo eksportowac go
      # jeszcze raz do lokalnego Dockera (podwaja zapotrzebowanie na dysk w
      # momencie eksportu). Wersje sprawdzamy z logow builda (RUN ... | tee
      # /opt/build-versions.txt w Dockerfile drukuje je wprost do logu).
      # secrets: CIVITAI_API_KEY - montowany w Dockerfile przez
      # --mount=type=secret przy pobieraniu LoRA "Add Detail - Slider"
      # (patrz komentarz w Dockerfile) - build-push-action przekazuje go
      # do BuildKit jako secret, nigdy jako zwykly ARG/ENV zapisywany
      # w warstwie obrazu.
      # cache-from/cache-to: type=gha TYMCZASOWO wylaczone (sierpien 2026) -
      # diagnostyka po 3 zawieszonych buildach z rzedu ("duration_ms: 0",
      # brak logow), zeby wykluczyc/potwierdzic zapis duzego cache do
      # serwisu GitHub Actions Cache jako mozliwa przyczyna zawieszenia
      # (curl z timeoutami juz wykluczony jako jedyna przyczyna). Przywrocic
      # po potwierdzeniu, ze bez cache build przechodzi normalnie.
      - name: Zbuduj obraz (bez push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: foto-ai-serwer:test
          secrets: |
            CIVITAI_API_KEY=${{ secrets.CIVITAI_API_KEY }}
